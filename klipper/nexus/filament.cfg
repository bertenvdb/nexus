# Nexus toolchanger: filament runout and motion sensors.
# Do not edit. All user settings live in nexus.cfg.
#
# Sensors are optional per tool: include nexus/filament/tN_runout.cfg
# and/or tN_motion.cfg in nexus.cfg.
#   runout (switch, pin 1): always enabled.
#     Active tool -> pause.
#     Parked tool -> runout_parked = 'pause': pause immediately;
#                    'defer': mark the tool empty, pause after its next pickup.
#   motion (pin 4): only enabled for the mounted tool (all tools share one
#     extruder drive). No pulse over detection_length mm -> pause.

[gcode_macro _NEXUS_RUNOUT]
gcode:
  {% set cfg = printer['gcode_macro _NEXUS_CFG'] %}
  {% set st = printer['gcode_macro _NEXUS_STATE'] %}
  {% set t = params.TOOL|int %}
  {% set kind = params.SENSOR %}
  {% if t == st.current_tool %}
    RESPOND TYPE=error MSG="Nexus: filament {kind} sensor triggered on T{t} (mounted tool), pausing"
    PAUSE
  {% elif kind == 'runout' %}
    {% if t not in st.empty_tools %}
      SET_GCODE_VARIABLE MACRO=_NEXUS_STATE VARIABLE=empty_tools VALUE="{st.empty_tools + [t]}"
    {% endif %}
    {% if cfg.runout_parked == 'pause' %}
      RESPOND TYPE=error MSG="Nexus: filament runout on parked T{t}, pausing"
      PAUSE
    {% else %}
      RESPOND TYPE=error MSG="Nexus: filament runout on parked T{t}; the print pauses when T{t} is picked up"
    {% endif %}
  {% endif %}

[gcode_macro _NEXUS_INSERT]
gcode:
  {% set st = printer['gcode_macro _NEXUS_STATE'] %}
  {% set t = params.TOOL|int %}
  {% if t in st.empty_tools %}
    {% set ns = namespace(q=[]) %}
    {% for e in st.empty_tools %}
      {% if e != t %}
        {% set ns.q = ns.q + [e] %}
      {% endif %}
    {% endfor %}
    SET_GCODE_VARIABLE MACRO=_NEXUS_STATE VARIABLE=empty_tools VALUE="{ns.q}"
  {% endif %}
  RESPOND MSG="Nexus: filament detected on T{t}"

# Called after a pickup: pause if the new tool has no filament. The live
# runout switch decides; a reload during the print clears the 'empty' mark
# (Klipper runs insert_gcode only when not printing).
[gcode_macro _NEXUS_CHECK_EMPTY]
gcode:
  {% set st = printer['gcode_macro _NEXUS_STATE'] %}
  {% set t = params.TOOL|int %}
  {% set rs = printer['filament_switch_sensor nexus_t' ~ t ~ '_runout'] %}
  {% set printing = printer.print_stats is defined and printer.print_stats.state == 'printing' %}
  {% if rs is defined and rs.enabled %}
    {% set empty = not rs.filament_detected %}
    {% if not empty and t in st.empty_tools %}
      _NEXUS_INSERT TOOL={t}
    {% endif %}
  {% else %}
    {% set empty = t in st.empty_tools %}
  {% endif %}
  {% if t >= 0 and printing and empty %}
    RESPOND TYPE=error MSG="Nexus: T{t} has no filament, pausing. Load filament, then RESUME"
    PAUSE
  {% endif %}

[gcode_macro NEXUS_CLEAR_EMPTY]
description: Forget the 'empty' mark of all tools (or TOOL=n) after reloading filament
gcode:
  {% if params.TOOL is defined %}
    _NEXUS_INSERT TOOL={params.TOOL|int}
  {% else %}
    SET_GCODE_VARIABLE MACRO=_NEXUS_STATE VARIABLE=empty_tools VALUE="[]"
  {% endif %}

# Enable only the motion sensor of tool TOOL (-1 = none).
[gcode_macro _NEXUS_MOTION_SENSORS]
gcode:
  {% set t = params.TOOL|int %}
  {% for i in range(8) %}
    {% if printer['filament_motion_sensor nexus_t' ~ i ~ '_motion'] is defined %}
      SET_FILAMENT_SENSOR SENSOR=nexus_t{i}_motion ENABLE={1 if i == t else 0}
    {% endif %}
  {% endfor %}
