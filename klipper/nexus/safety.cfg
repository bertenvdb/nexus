# SPDX-License-Identifier: GPL-3.0-or-later
# Nexus toolchanger: heater rail cutoff, rail voltage, startup self-test and
# commissioning test (architecture sections 9.4 to 9.6, AD-10, AD-13).
# Do not edit. All user settings live in nexus.cfg.

# Hardware cutoff of the heater rail (LM74502 + back-to-back FETs).
# Off at boot and on every shutdown. Only the self-test switches it on.
[output_pin nexus_heater_enable]
pin: nexus_tools:PB12
value: 0
shutdown_value: 0

# RAIL_SENSE: divider 100k/10k (ratio 11) to an ADC referenced to VREF_A
# (3.3 V), so 3.3 V at the pin = 36.3 V on the rail. Klipper only knows
# temperature sensors: the "temperature" of this sensor is the rail voltage.
[adc_temperature nexus_rail_voltage]
temperature1: 0
voltage1: 0
temperature2: 36.3
voltage2: 3.3

[temperature_sensor nexus_heater_rail]
sensor_type: nexus_rail_voltage
sensor_pin: nexus_tools:PC4
adc_voltage: 3.3
# Wide limits: a 0 V rail must never cause a shutdown.
min_temp: -10
max_temp: 40

[gcode_macro _NEXUS_SELFTEST_START]
gcode:
  {% set cfg = printer['gcode_macro _NEXUS_CFG'] %}
  SET_GCODE_VARIABLE MACRO=_NEXUS_STATE VARIABLE=selftest VALUE="'running'"
  SET_PIN PIN=nexus_heater_enable VALUE=0
  G4 P{cfg.rail_settle_ms}
  M400
  _NEXUS_SELFTEST_CHECK_OFF

[gcode_macro _NEXUS_SELFTEST_CHECK_OFF]
gcode:
  {% set cfg = printer['gcode_macro _NEXUS_CFG'] %}
  {% set v = printer['temperature_sensor nexus_heater_rail'].temperature %}
  {% if v > cfg.rail_off_max %}
    _NEXUS_SELFTEST_FAIL MSG="rail is {'%.1f' % v} V with the cutoff off (max {cfg.rail_off_max} V): cutoff FET shorted or measurement fault"
  {% else %}
    SET_PIN PIN=nexus_heater_enable VALUE=1
    G4 P{cfg.rail_settle_ms}
    M400
    _NEXUS_SELFTEST_CHECK_ON
  {% endif %}

[gcode_macro _NEXUS_SELFTEST_CHECK_ON]
gcode:
  {% set cfg = printer['gcode_macro _NEXUS_CFG'] %}
  {% set v = printer['temperature_sensor nexus_heater_rail'].temperature %}
  {% if v < cfg.rail_on_min or v > cfg.rail_on_max %}
    _NEXUS_SELFTEST_FAIL MSG="rail is {'%.1f' % v} V with the cutoff on (expected {cfg.rail_on_min} to {cfg.rail_on_max} V): no 24 V input, fuse or cutoff fault"
  {% else %}
    SET_GCODE_VARIABLE MACRO=_NEXUS_STATE VARIABLE=selftest VALUE="'passed'"
    RESPOND MSG="Nexus: heater rail self-test passed ({'%.1f' % v} V), heaters enabled"
  {% endif %}

[gcode_macro _NEXUS_SELFTEST_FAIL]
gcode:
  SET_PIN PIN=nexus_heater_enable VALUE=0
  SET_GCODE_VARIABLE MACRO=_NEXUS_STATE VARIABLE=selftest VALUE="'failed'"
  RESPOND TYPE=error MSG="Nexus: heater rail self-test FAILED: {params.MSG}"
  _NEXUS_SELFTEST_STOP MSG="{params.MSG}"

# Separate macro: action_emergency_stop() acts while rendering, so the cutoff
# and the message above are handled first.
[gcode_macro _NEXUS_SELFTEST_STOP]
gcode:
  {% set cfg = printer['gcode_macro _NEXUS_CFG'] %}
  {% if cfg.selftest_fail_shutdown %}
    {action_emergency_stop("Nexus heater rail self-test failed: " ~ params.MSG)}
  {% endif %}

[gcode_macro NEXUS_SELFTEST]
description: Switch the heater rail cutoff off and on and check the rail voltage
gcode:
  {% set ns = namespace(hot=[]) %}
  {% for i in range(8) %}
    {% set h = printer['extruder' ~ (i if i > 0 else '')] %}
    {% if h is defined and h.target > 0 %}
      {% set ns.hot = ns.hot + ['T' ~ i] %}
    {% endif %}
  {% endfor %}
  {% if printer.print_stats is defined and printer.print_stats.state in ['printing', 'paused'] %}
    {action_raise_error("Nexus: no self-test during a print")}
  {% elif ns.hot %}
    {action_raise_error("Nexus: turn off all heaters first (%s)" % ns.hot|join(' '))}
  {% endif %}
  _NEXUS_SELFTEST_START

# Commissioning test (architecture section 9.5). Heat one tool at a time
# and check that only its own thermistor rises. Run after every (re)wiring.
[gcode_macro NEXUS_COMMISSION]
description: Check heater/thermistor wiring per tool. Optional TOOL=n, otherwise all enabled tools
gcode:
  {% set cfg = printer['gcode_macro _NEXUS_CFG'] %}
  {% set st = printer['gcode_macro _NEXUS_STATE'] %}
  {% set ns = namespace(tools=[], hot=[]) %}
  {% for i in range(8) %}
    {% set iv = printer['gcode_macro _NEXUS_T' ~ i] %}
    {% if iv is defined and iv.enabled %}
      {% set h = printer['extruder' ~ (i if i > 0 else '')] %}
      {% if h.target > 0 or h.temperature > cfg.commission_max_start %}
        {% set ns.hot = ns.hot + ['T' ~ i] %}
      {% endif %}
      {% if params.TOOL is not defined or params.TOOL|int == i %}
        {% set ns.tools = ns.tools + [i] %}
      {% endif %}
    {% endif %}
  {% endfor %}
  {% if st.selftest != 'passed' %}
    {action_raise_error("Nexus: the heater rail self-test must pass first")}
  {% elif printer.print_stats is defined and printer.print_stats.state in ['printing', 'paused'] %}
    {action_raise_error("Nexus: no commissioning during a print")}
  {% elif ns.hot %}
    {action_raise_error("Nexus: all tools must be off and below %.0f C (%s)" % (cfg.commission_max_start, ns.hot|join(' ')))}
  {% elif not ns.tools %}
    {action_raise_error("Nexus: no enabled tool to test")}
  {% endif %}
  RESPOND MSG="Nexus: commissioning {ns.tools|length} tool(s), {cfg.commission_time} s each. Stay at the printer."
  {% for i in ns.tools %}
    _NEXUS_COMMISSION_START TOOL={i}
    G4 P{cfg.commission_time * 1000}
    M400
    _NEXUS_COMMISSION_EVAL TOOL={i}
  {% endfor %}
  RESPOND MSG="Nexus: commissioning PASSED for T{ns.tools|join(' T')}"

[gcode_macro _NEXUS_COMMISSION_START]
gcode:
  {% set cfg = printer['gcode_macro _NEXUS_CFG'] %}
  {% set t = params.TOOL|int %}
  {% set ns = namespace(start={}) %}
  {% for i in range(8) %}
    {% set iv = printer['gcode_macro _NEXUS_T' ~ i] %}
    {% if iv is defined and iv.enabled %}
      {% set temp = printer['extruder' ~ (i if i > 0 else '')].temperature %}
      {% set _ = ns.start.update({i: (temp * 10)|round / 10}) %}
    {% endif %}
  {% endfor %}
  {% set ext = 'extruder' ~ (t if t > 0 else '') %}
  SET_GCODE_VARIABLE MACRO=_NEXUS_STATE VARIABLE=comm_start VALUE="{ns.start}"
  RESPOND MSG="Nexus: commissioning T{t}: heating for {cfg.commission_time} s"
  SET_HEATER_TEMPERATURE HEATER={ext} TARGET={ns.start[t] + cfg.commission_delta}

[gcode_macro _NEXUS_COMMISSION_EVAL]
gcode:
  {% set cfg = printer['gcode_macro _NEXUS_CFG'] %}
  {% set st = printer['gcode_macro _NEXUS_STATE'] %}
  {% set t = params.TOOL|int %}
  {% set ns = namespace(own=0.0, cross=[]) %}
  {% for i, start in st.comm_start.items() %}
    {% set rise = printer['extruder' ~ (i if i > 0 else '')].temperature - start %}
    {% if i == t %}
      {% set ns.own = rise %}
    {% elif rise >= cfg.commission_cross_max %}
      {% set ns.cross = ns.cross + ['T%d +%.1f C' % (i, rise)] %}
    {% endif %}
  {% endfor %}
  {% if ns.own < cfg.commission_rise or ns.cross %}
    {action_emergency_stop("Nexus commissioning FAILED for T%d: own thermistor +%.1f C (need %.1f), other tools rising: %s. Check heater and thermistor wiring." % (t, ns.own, cfg.commission_rise, ns.cross|join(', ') if ns.cross else 'none'))}
  {% endif %}
  SET_HEATER_TEMPERATURE HEATER={'extruder' ~ (t if t > 0 else '')} TARGET=0
  RESPOND MSG="Nexus: commissioning T{t} OK (+{'%.1f' % ns.own} C, no other tool rose)"
