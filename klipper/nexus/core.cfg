# Nexus toolchanger: runtime state, startup, config check, status.
# Do not edit. All user settings live in nexus.cfg.

# Needed for RESPOND. Harmless if printer.cfg also has [respond].
[respond]

# Runtime state. Not a setting: changed by the macros only.
[gcode_macro _NEXUS_STATE]
variable_config_ok: False
variable_selftest: 'pending'
variable_current_tool: -1
variable_changing: False
variable_empty_tools: []
variable_heat_queue: []
variable_comm_start: {}
gcode:

[temperature_sensor nexus_tools_mcu]
sensor_type: temperature_mcu
sensor_mcu: nexus_tools

[temperature_sensor nexus_docks_mcu]
sensor_type: temperature_mcu
sensor_mcu: nexus_docks

# MCU status LEDs: on while Klipper runs, off on shutdown.
[output_pin nexus_tools_status_led]
pin: nexus_tools:PB4
value: 1
shutdown_value: 0

[output_pin nexus_docks_status_led]
pin: nexus_docks:PB4
value: 1
shutdown_value: 0

[delayed_gcode _NEXUS_INIT]
initial_duration: 1.0
gcode:
  _NEXUS_SETUP_DISPLAY
  _NEXUS_CONFIG_CHECK
  _NEXUS_RESTORE_TOOL
  _NEXUS_SELFTEST_START

[gcode_macro _NEXUS_CONFIG_CHECK]
gcode:
  {% set cfg = printer['gcode_macro _NEXUS_CFG'] %}
  {% set settings = printer.configfile.settings %}
  {% set ns = namespace(errors=[], warnings=[], tools=[]) %}

  {% if settings['save_variables'] is not defined %}
    {% set ns.errors = ns.errors + ["section [save_variables] is missing"] %}
  {% endif %}
  {% if settings['extruder_stepper nexus_extruder'] is not defined %}
    {% set ns.errors = ns.errors + ["section [extruder_stepper nexus_extruder] is missing"] %}
  {% endif %}
  {% if cfg.dock_direction not in ['X+', 'X-', 'Y+', 'Y-'] %}
    {% set ns.errors = ns.errors + ["dock_direction must be 'X+', 'X-', 'Y+' or 'Y-'"] %}
  {% endif %}
  {% if cfg.runout_parked not in ['defer', 'pause'] %}
    {% set ns.errors = ns.errors + ["runout_parked must be 'defer' or 'pause'"] %}
  {% endif %}
  {% if cfg.max_cold_heaters|int < 1 %}
    {% set ns.errors = ns.errors + ["max_cold_heaters must be 1 or more"] %}
  {% endif %}
  {% for name in ['dock_moves', 'pickup_moves'] %}
    {% for m in cfg[name] %}
      {% if m.d is not defined or m.f is not defined %}
        {% set ns.errors = ns.errors + [name ~ ": every move needs 'd' and 'f'"] %}
      {% endif %}
    {% endfor %}
  {% endfor %}
  {% for state in ['cold', 'heating', 'standby', 'active', 'cooling'] %}
    {% if cfg.led_colors[state] is not defined %}
      {% set ns.errors = ns.errors + ["led_colors has no entry '" ~ state ~ "'"] %}
    {% endif %}
  {% endfor %}

  {% for t in range(8) %}
    {% set tv = printer['gcode_macro _NEXUS_T' ~ t] %}
    {% if tv is defined and tv.enabled %}
      {% set ns.tools = ns.tools + ['T' ~ t] %}
    {% endif %}
  {% endfor %}
  {% if not ns.tools %}
    {% set ns.errors = ns.errors + ["no tool is enabled"] %}
  {% endif %}
  {% if not cfg.docks_verified %}
    {% set ns.warnings = ns.warnings + ["docks_verified is False: tool changes are blocked until the dock coordinates are checked"] %}
  {% endif %}

  {% for w in ns.warnings %}
    RESPOND TYPE=echo MSG="Nexus: warning: {w}"
  {% endfor %}
  {% for e in ns.errors %}
    RESPOND TYPE=error MSG="Nexus: config error: {e}"
  {% endfor %}
  {% if ns.errors %}
    SET_GCODE_VARIABLE MACRO=_NEXUS_STATE VARIABLE=config_ok VALUE=False
    RESPOND TYPE=error MSG="Nexus: config check FAILED, tool changes are disabled"
  {% else %}
    SET_GCODE_VARIABLE MACRO=_NEXUS_STATE VARIABLE=config_ok VALUE=True
    RESPOND MSG="Nexus: config check OK, enabled tools: {ns.tools|join(' ')}"
  {% endif %}

# Restore the mounted tool after a restart (there is no tool detection).
[gcode_macro _NEXUS_RESTORE_TOOL]
gcode:
  {% set sv = printer.save_variables %}
  {% set t = -1 %}
  {% if sv is defined %}
    {% set t = sv.variables.nexus_current_tool|default(-1)|int %}
  {% endif %}
  {% set tv = printer['gcode_macro _NEXUS_T' ~ t] %}
  {% if t >= 0 and (tv is not defined or not tv.enabled) %}
    RESPOND TYPE=error MSG="Nexus: saved tool T{t} is not enabled, assuming no tool is mounted"
    {% set t = -1 %}
  {% endif %}
  _NEXUS_APPLY_TOOL TOOL={t}
  {% if t >= 0 %}
    RESPOND MSG="Nexus: T{t} is mounted (saved state). Use NEXUS_SET_TOOL if this is wrong."
  {% else %}
    RESPOND MSG="Nexus: no tool mounted (saved state). Use NEXUS_SET_TOOL if this is wrong."
  {% endif %}

# Record tool TOOL as mounted, activate its extruder, sync the drive and set
# its offsets. No movement.
[gcode_macro _NEXUS_APPLY_TOOL]
gcode:
  {% set t = params.TOOL|int %}
  {% set settings = printer.configfile.settings %}
  {% if settings['save_variables'] is defined %}
    SAVE_VARIABLE VARIABLE=nexus_current_tool VALUE={t}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_NEXUS_STATE VARIABLE=current_tool VALUE={t}
  {% if t >= 0 %}
    {% set ext = 'extruder' ~ (t if t > 0 else '') %}
    {% set tv = printer['gcode_macro _NEXUS_T' ~ t] %}
    {% if printer.toolhead.extruder != ext %}
      ACTIVATE_EXTRUDER EXTRUDER={ext}
    {% endif %}
    {% if settings['extruder_stepper nexus_extruder'] is defined %}
      SYNC_EXTRUDER_MOTION EXTRUDER=nexus_extruder MOTION_QUEUE={ext}
    {% endif %}
    SET_GCODE_OFFSET X={tv.offset_x} Y={tv.offset_y} Z={tv.offset_z} MOVE=0
  {% else %}
    {% if settings['extruder_stepper nexus_extruder'] is defined %}
      SYNC_EXTRUDER_MOTION EXTRUDER=nexus_extruder MOTION_QUEUE=
    {% endif %}
    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0
  {% endif %}
  _NEXUS_MOTION_SENSORS TOOL={t}

[gcode_macro NEXUS_SET_TOOL]
description: Declare which tool is physically mounted (no movement). TOOL=n, -1 = none
gcode:
  {% set t = params.TOOL|default(-2)|int %}
  {% set tv = printer['gcode_macro _NEXUS_T' ~ t] %}
  {% if t < -1 or t > 7 %}
    {action_raise_error("NEXUS_SET_TOOL: TOOL must be -1 (none) or 0..7")}
  {% elif t >= 0 and (tv is not defined or not tv.enabled) %}
    {action_raise_error("NEXUS_SET_TOOL: T%d is not enabled" % t)}
  {% endif %}
  _NEXUS_APPLY_TOOL TOOL={t}
  RESPOND MSG="Nexus: mounted tool set to {'T' ~ t if t >= 0 else 'none'}"

[gcode_macro NEXUS_PRINT_START]
description: Call from PRINT_START. Refuses to print if the config check or the cutoff self-test did not pass
gcode:
  {% set st = printer['gcode_macro _NEXUS_STATE'] %}
  {% if not st.config_ok %}
    {action_raise_error("Nexus: config check failed, see the console after restart")}
  {% endif %}
  {% if st.selftest != 'passed' %}
    {action_raise_error("Nexus: heater rail self-test has not passed (state: %s). Run NEXUS_SELFTEST" % st.selftest)}
  {% endif %}
  _NEXUS_MOTION_SENSORS TOOL={st.current_tool}

[gcode_macro NEXUS_STATUS]
description: Show the state of all Nexus tools
gcode:
  {% set cfg = printer['gcode_macro _NEXUS_CFG'] %}
  {% set st = printer['gcode_macro _NEXUS_STATE'] %}
  {% set rail = printer['temperature_sensor nexus_heater_rail'] %}
  {% set ns = namespace(lines=[]) %}
  {% set ns.lines = ns.lines + ["mounted: " ~ ('T' ~ st.current_tool if st.current_tool >= 0 else 'none')
      ~ " | rail self-test: " ~ st.selftest
      ~ " | rail: " ~ ('%.1f V' % rail.temperature if rail is defined else 'n/a')
      ~ " | cutoff: " ~ ('on' if printer['output_pin nexus_heater_enable'].value > 0 else 'off')] %}
  {% for t in range(8) %}
    {% set tv = printer['gcode_macro _NEXUS_T' ~ t] %}
    {% if tv is not defined %}
      {% set ns.lines = ns.lines + ["T" ~ t ~ ": not configured"] %}
    {% elif not tv.enabled %}
      {% set ns.lines = ns.lines + ["T" ~ t ~ ": disabled (placeholder)"] %}
    {% else %}
      {% set h = printer['extruder' ~ (t if t > 0 else '')] %}
      {% set line = "T%d: %.1f / %.0f C" % (t, h.temperature, h.target) %}
      {% set rs = printer['filament_switch_sensor nexus_t' ~ t ~ '_runout'] %}
      {% set ms = printer['filament_motion_sensor nexus_t' ~ t ~ '_motion'] %}
      {% if rs is defined %}
        {% set line = line ~ " | runout: " ~ ('filament' if rs.filament_detected else 'EMPTY') %}
      {% endif %}
      {% if ms is defined %}
        {% set line = line ~ " | motion: " ~ ('enabled' if ms.enabled else 'disabled') %}
      {% endif %}
      {% if t in st.empty_tools %}
        {% set line = line ~ " | marked empty" %}
      {% endif %}
      {% set ln = namespace(text=line) %}
      {% for q in st.heat_queue %}
        {% if q[0] == t %}
          {% set ln.text = ln.text ~ " | queued: %.0f C" % q[1] %}
        {% endif %}
      {% endfor %}
      {% set ns.lines = ns.lines + [ln.text] %}
    {% endif %}
  {% endfor %}
  {action_respond_info(ns.lines|join("\n"))}
