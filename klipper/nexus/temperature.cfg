# Nexus toolchanger: hotend temperatures with staggered heat-up.
# Do not edit. All user settings live in nexus.cfg.
#
# At most max_cold_heaters hotends may heat from cold at the same time (PSU
# limit, architecture section 9.8). A hotend counts as "cold" while it has a
# target and is below min(cold_threshold, target - cold_margin): then it
# draws (nearly) full power.
#   M104: a request that does not fit is queued and started as soon as a
#         slot frees up (checked every second).
#   M109: waits until enough of the other cold hotends are warm, then heats.
# SET_HEATER_TEMPERATURE bypasses these rules.

[gcode_macro M104]
rename_existing: M104.9
description: Set hotend temperature (Nexus: staggered heat-up)
gcode:
  {% set t = params.T|default(-1)|int %}
  {% if t < 0 %}
    {% set active = printer.toolhead.extruder %}
    {% set t = 0 if active == 'extruder' else active[8:]|int %}
  {% endif %}
  _NEXUS_SET_TEMP TOOL={t} TEMP={params.S|default(0)|float} WAIT=0

[gcode_macro M109]
rename_existing: M109.9
description: Set hotend temperature and wait (Nexus: staggered heat-up)
gcode:
  {% set t = params.T|default(-1)|int %}
  {% if t < 0 %}
    {% set active = printer.toolhead.extruder %}
    {% set t = 0 if active == 'extruder' else active[8:]|int %}
  {% endif %}
  _NEXUS_SET_TEMP TOOL={t} TEMP={params.S|default(0)|float} WAIT=1

[gcode_macro TURN_OFF_HEATERS]
rename_existing: _NEXUS_TURN_OFF_HEATERS_BASE
description: Turn off all heaters and clear the Nexus heat-up queue
gcode:
  SET_GCODE_VARIABLE MACRO=_NEXUS_STATE VARIABLE=heat_queue VALUE="[]"
  _NEXUS_TURN_OFF_HEATERS_BASE

[gcode_macro _NEXUS_SET_TEMP]
gcode:
  {% set cfg = printer['gcode_macro _NEXUS_CFG'] %}
  {% set st = printer['gcode_macro _NEXUS_STATE'] %}
  {% set t = params.TOOL|int %}
  {% set temp = params.TEMP|float %}
  {% set wait = params.WAIT|int %}
  {% set tv = printer['gcode_macro _NEXUS_T' ~ t] %}
  {% set ext = 'extruder' ~ (t if t > 0 else '') %}

  {% if tv is not defined or not tv.enabled %}
    {% if temp > 0 %}
      {action_raise_error("Nexus: T%d is not enabled" % t)}
    {% endif %}
  {% elif temp <= 0 %}
    _NEXUS_QUEUE_REMOVE TOOL={t}
    M104.9 T{t} S0
  {% else %}
    {% if st.selftest != 'passed' %}
      {action_raise_error("Nexus: heater rail is off, self-test state: %s. Run NEXUS_SELFTEST" % st.selftest)}
    {% endif %}
    {% set ns = namespace(cold=[]) %}
    {% for i in range(8) %}
      {% set iv = printer['gcode_macro _NEXUS_T' ~ i] %}
      {% if i != t and iv is defined and iv.enabled %}
        {% set h = printer['extruder' ~ (i if i > 0 else '')] %}
        {% set limit = [cfg.cold_threshold, h.target - cfg.cold_margin]|min %}
        {% if h.target > 0 and h.temperature < limit %}
          {% set ns.cold = ns.cold + [[h.temperature, i, limit]] %}
        {% endif %}
      {% endif %}
    {% endfor %}
    {% set me_cold = printer[ext].temperature < [cfg.cold_threshold, temp - cfg.cold_margin]|min %}
    {% set free = cfg.max_cold_heaters|int - ns.cold|length %}

    {% if not me_cold or free > 0 %}
      _NEXUS_QUEUE_REMOVE TOOL={t}
      M104.9 T{t} S{temp}
    {% elif not wait %}
      _NEXUS_QUEUE_ADD TOOL={t} TEMP={temp}
      RESPOND MSG="Nexus: T{t} queued ({cfg.max_cold_heaters} hotends already heating from cold)"
    {% else %}
      {% set needed = 1 - free %}
      RESPOND MSG="Nexus: T{t} waits for {needed} other hotend(s) to warm up"
      {% for c in (ns.cold|sort(reverse=true))[:needed] %}
        TEMPERATURE_WAIT SENSOR={'extruder' ~ (c[1] if c[1] > 0 else '')} MINIMUM={c[2]}
      {% endfor %}
      _NEXUS_QUEUE_REMOVE TOOL={t}
      M104.9 T{t} S{temp}
    {% endif %}
    {% if wait %}
      M109.9 T{t} S{temp}
    {% endif %}
  {% endif %}

[gcode_macro _NEXUS_QUEUE_ADD]
gcode:
  {% set st = printer['gcode_macro _NEXUS_STATE'] %}
  {% set t = params.TOOL|int %}
  {% set ns = namespace(q=[]) %}
  {% for e in st.heat_queue %}
    {% if e[0] != t %}
      {% set ns.q = ns.q + [e] %}
    {% endif %}
  {% endfor %}
  {% set ns.q = ns.q + [[t, params.TEMP|float]] %}
  SET_GCODE_VARIABLE MACRO=_NEXUS_STATE VARIABLE=heat_queue VALUE="{ns.q}"
  UPDATE_DELAYED_GCODE ID=_NEXUS_HEAT_QUEUE DURATION=1

[gcode_macro _NEXUS_QUEUE_REMOVE]
gcode:
  {% set st = printer['gcode_macro _NEXUS_STATE'] %}
  {% set t = params.TOOL|int %}
  {% set ns = namespace(q=[]) %}
  {% for e in st.heat_queue %}
    {% if e[0] != t %}
      {% set ns.q = ns.q + [e] %}
    {% endif %}
  {% endfor %}
  {% if ns.q|length != st.heat_queue|length %}
    SET_GCODE_VARIABLE MACRO=_NEXUS_STATE VARIABLE=heat_queue VALUE="{ns.q}"
  {% endif %}

[delayed_gcode _NEXUS_HEAT_QUEUE]
gcode:
  _NEXUS_HEAT_QUEUE_TICK

# Start queued hotends in order as long as slots are free.
[gcode_macro _NEXUS_HEAT_QUEUE_TICK]
gcode:
  {% set cfg = printer['gcode_macro _NEXUS_CFG'] %}
  {% set st = printer['gcode_macro _NEXUS_STATE'] %}
  {% set ns = namespace(cold=0, keep=[], start=[]) %}
  {% for i in range(8) %}
    {% set iv = printer['gcode_macro _NEXUS_T' ~ i] %}
    {% if iv is defined and iv.enabled %}
      {% set h = printer['extruder' ~ (i if i > 0 else '')] %}
      {% if h.target > 0 and h.temperature < [cfg.cold_threshold, h.target - cfg.cold_margin]|min %}
        {% set ns.cold = ns.cold + 1 %}
      {% endif %}
    {% endif %}
  {% endfor %}
  {% for e in st.heat_queue %}
    {% set t = e[0] %}
    {% set iv = printer['gcode_macro _NEXUS_T' ~ t] %}
    {% if st.selftest == 'passed' and iv is defined and iv.enabled %}
      {% set h = printer['extruder' ~ (t if t > 0 else '')] %}
      {% set me_cold = h.temperature < [cfg.cold_threshold, e[1] - cfg.cold_margin]|min %}
      {% if not me_cold or ns.cold < cfg.max_cold_heaters|int %}
        {% set ns.start = ns.start + [e] %}
        {% if me_cold %}
          {% set ns.cold = ns.cold + 1 %}
        {% endif %}
      {% else %}
        {% set ns.keep = ns.keep + [e] %}
      {% endif %}
    {% endif %}
  {% endfor %}
  SET_GCODE_VARIABLE MACRO=_NEXUS_STATE VARIABLE=heat_queue VALUE="{ns.keep}"
  {% for e in ns.start %}
    M104.9 T{e[0]} S{e[1]}
    RESPOND MSG="Nexus: T{e[0]} heating to {e[1]} C (from queue)"
  {% endfor %}
  {% if ns.keep %}
    UPDATE_DELAYED_GCODE ID=_NEXUS_HEAT_QUEUE DURATION=1
  {% endif %}
