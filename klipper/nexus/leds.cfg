# Nexus toolchanger: status LEDs (one per tool on both boards) and the
# supply fan. Do not edit. All user settings live in nexus.cfg.
#
# The colours come from display templates. Klipper renders these on a host
# timer, so they keep updating during M109 and TEMPERATURE_WAIT (a
# delayed_gcode loop would stall there).

[neopixel nexus_tools_leds]
pin: nexus_tools:PB3
chain_count: 8
color_order: GRB

[neopixel nexus_docks_leds]
pin: nexus_docks:PB3
chain_count: 8
color_order: GRB

# Fresh-air supply fan for the dock fans (fan output 8 on the dock board).
[fan_generic nexus_supply_fan]
pin: nexus_docks:PB12
kick_start_time: 0.5

# Colour of one tool. States (tolerance = temp_tolerance):
#   cold     anything else (below cool_temp, not heating)
#   heating  temp below target - tolerance
#   standby  at target, target <= standby_temp
#   active   at target, target > standby_temp
#   cooling  temp above target + tolerance and >= cool_temp
[display_template _nexus_tool_led]
param_tool: -1
text:
  {% set cfg = printer['gcode_macro _NEXUS_CFG'] %}
  {% set t = param_tool|int %}
  {% set tv = printer['gcode_macro _NEXUS_T' ~ t] %}
  {% if t < 0 or tv is not defined or not tv.enabled %}
    0,0,0,0
  {% else %}
    {% set h = printer['extruder' ~ (t if t > 0 else '')] %}
    {% set tol = cfg.temp_tolerance %}
    {% if h.target > 0 and h.temperature < h.target - tol %}
      {% set state = 'heating' %}
    {% elif h.temperature > h.target + tol and h.temperature >= cfg.cool_temp %}
      {% set state = 'cooling' %}
    {% elif h.target > 0 and h.temperature <= h.target + tol %}
      {% set state = 'standby' if h.target <= cfg.standby_temp else 'active' %}
    {% else %}
      {% set state = 'cold' %}
    {% endif %}
    {% set c = cfg.led_colors[state] %}
    {% set b = cfg.led_brightness %}
    {c[0] * b},{c[1] * b},{c[2] * b},0
  {% endif %}

# Supply fan: on as long as any tool is warm or has a target (the same rule
# as the dock fans, which are heater_fans).
[display_template _nexus_supply_fan]
text:
  {% set cfg = printer['gcode_macro _NEXUS_CFG'] %}
  {% set ns = namespace(on=False) %}
  {% for t in range(8) %}
    {% set tv = printer['gcode_macro _NEXUS_T' ~ t] %}
    {% if tv is defined and tv.enabled %}
      {% set h = printer['extruder' ~ (t if t > 0 else '')] %}
      {% if h.target > 0 or h.temperature >= cfg.supply_fan_temp %}
        {% set ns.on = True %}
      {% endif %}
    {% endif %}
  {% endfor %}
  {cfg.supply_fan_speed if ns.on else 0}

[gcode_macro _NEXUS_SETUP_DISPLAY]
gcode:
  {% set cfg = printer['gcode_macro _NEXUS_CFG'] %}
  {% for led, order in [('nexus_tools_leds', cfg.led_order_tools), ('nexus_docks_leds', cfg.led_order_docks)] %}
    {% set count = printer.configfile.settings['neopixel ' ~ led].chain_count %}
    {% for i in range(count) %}
      SET_LED_TEMPLATE LED={led} INDEX={i + 1} TEMPLATE=_nexus_tool_led PARAM_TOOL={order[i] if i < order|length else -1}
    {% endfor %}
  {% endfor %}
  SET_FAN_SPEED FAN=nexus_supply_fan TEMPLATE=_nexus_supply_fan
