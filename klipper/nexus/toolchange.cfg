# Nexus toolchanger: tool change for the YUDX dock mechanism.
# Do not edit. All user settings live in nexus.cfg.
#
# YUDX opens and closes the latch with extruder (E) moves, so the drive
# stepper must be synced to the extruder of the tool being docked or picked
# up, and that tool must be at or above min_extrude_temp.
#
# Moves in dock_moves/pickup_moves are relative to the dock position along
# the dock axis: d = distance from the engaged dock position (d = 0), away
# from the dock. e = relative extruder move (mm), f = feed rate (mm/min).

[gcode_macro NEXUS_CHANGE_TOOL]
description: Dock the mounted tool and pick up tool TOOL (-1 = only dock)
gcode:
  {% set cfg = printer['gcode_macro _NEXUS_CFG'] %}
  {% set st = printer['gcode_macro _NEXUS_STATE'] %}
  {% set new = params.TOOL|default(-2)|int %}
  {% set cur = st.current_tool|int %}
  {% set homed = printer.toolhead.homed_axes %}
  {% set new_tv = printer['gcode_macro _NEXUS_T' ~ new] %}
  {% set cur_tv = printer['gcode_macro _NEXUS_T' ~ cur] %}
  {% set new_ext = 'extruder' ~ (new if new > 0 else '') %}
  {% set cur_ext = 'extruder' ~ (cur if cur > 0 else '') %}

  {% if new < -1 or new > 7 %}
    {action_raise_error("NEXUS_CHANGE_TOOL: TOOL must be -1..7")}
  {% elif not st.config_ok %}
    {action_raise_error("Nexus: config check failed, tool changes are disabled")}
  {% elif not cfg.docks_verified %}
    {action_raise_error("Nexus: set variable_docks_verified: True in nexus.cfg after checking the dock coordinates")}
  {% elif new >= 0 and (new_tv is not defined or not new_tv.enabled) %}
    {action_raise_error("Nexus: T%d is not enabled" % new)}
  {% elif 'x' not in homed or 'y' not in homed or ((cfg.z_hop > 0 or cfg.dock_z >= 0) and 'z' not in homed) %}
    {action_raise_error("Nexus: home the printer before a tool change")}
  {% endif %}

  {% if new == cur %}
    RESPOND MSG="Nexus: {'T' ~ new if new >= 0 else 'no tool'} already mounted"
  {% else %}
    {% if cur >= 0 %}
      {% set cur_min = printer.configfile.settings[cur_ext].min_extrude_temp %}
      {% if printer[cur_ext].temperature < cur_min %}
        {action_raise_error("Nexus: T%d is below min_extrude_temp (%.0f C); heat it before docking" % (cur, cur_min))}
      {% endif %}
    {% endif %}
    {% if new >= 0 %}
      {% set new_min = printer.configfile.settings[new_ext].min_extrude_temp %}
      {% set ns_q = namespace(temp=0) %}
      {% for q in st.heat_queue %}
        {% if q[0] == new %}
          {% set ns_q.temp = q[1] %}
        {% endif %}
      {% endfor %}
      {% if printer[new_ext].target < new_min and ns_q.temp < new_min %}
        {action_raise_error("Nexus: T%d target is %.0f C, below min_extrude_temp (%.0f C); set a temperature first" % (new, printer[new_ext].target, new_min))}
      {% endif %}
    {% endif %}

    {% set pos = printer.gcode_move.gcode_position %}
    {% set cur_oz = cur_tv.offset_z if cur >= 0 else 0.0 %}
    {% set user_z = printer.gcode_move.homing_origin.z - cur_oz %}

    SET_GCODE_VARIABLE MACRO=_NEXUS_STATE VARIABLE=changing VALUE=True
    _NEXUS_MOTION_SENSORS TOOL=-1
    {cfg.cmd_before_change}
    SAVE_GCODE_STATE NAME=_nexus_change
    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0
    G90
    M83
    {% if cfg.z_hop > 0 %}
      G91
      G1 Z{cfg.z_hop} F{cfg.z_speed * 60}
      G90
    {% endif %}
    {% if cfg.dock_z >= 0 %}
      G1 Z{cfg.dock_z} F{cfg.z_speed * 60}
    {% endif %}
    {% if cur >= 0 %}
      _NEXUS_DOCK TOOL={cur}
    {% endif %}
    {% if new >= 0 %}
      {% if ns_q.temp > 0 %}
        M109 T{new} S{ns_q.temp}
      {% endif %}
      _NEXUS_PICKUP TOOL={new}
    {% endif %}
    _NEXUS_APPLY_TOOL TOOL={new}
    RESTORE_GCODE_STATE NAME=_nexus_change MOVE=0
    {% if new >= 0 %}
      SET_GCODE_OFFSET X={new_tv.offset_x} Y={new_tv.offset_y} Z={new_tv.offset_z + user_z} MOVE=0
    {% else %}
      SET_GCODE_OFFSET X=0 Y=0 Z={user_z} MOVE=0
    {% endif %}
    {% if cfg.restore_position and new >= 0 %}
      SAVE_GCODE_STATE NAME=_nexus_return
      G90
      G1 X{pos.x} Y{pos.y} F{cfg.travel_speed * 60}
      G1 Z{pos.z} F{cfg.z_speed * 60}
      RESTORE_GCODE_STATE NAME=_nexus_return MOVE=0
    {% endif %}
    {cfg.cmd_after_change}
    SET_GCODE_VARIABLE MACRO=_NEXUS_STATE VARIABLE=changing VALUE=False
    _NEXUS_CHECK_EMPTY TOOL={new}
  {% endif %}

[gcode_macro NEXUS_PARK_TOOL]
description: Dock the mounted tool without picking up another
gcode:
  NEXUS_CHANGE_TOOL TOOL=-1

# Toolhead to the travel lane in front of dock TOOL, at the dock's
# cross-axis position.
[gcode_macro _NEXUS_GOTO_DOCK]
gcode:
  {% set cfg = printer['gcode_macro _NEXUS_CFG'] %}
  {% set tv = printer['gcode_macro _NEXUS_T' ~ params.TOOL] %}
  {% set axis = cfg.dock_direction[0] %}
  {% set other = 'Y' if axis == 'X' else 'X' %}
  {% set sign = 1 if cfg.dock_direction[1] == '-' else -1 %}
  {% set dock_a = tv.dock_x if axis == 'X' else tv.dock_y %}
  {% set dock_o = tv.dock_y if axis == 'X' else tv.dock_x %}
  G1 {axis}{dock_a + sign * cfg.travel_lane} F{cfg.travel_speed * 60}
  G1 {other}{dock_o} F{cfg.travel_speed * 60}

[gcode_macro _NEXUS_RUN_MOVES]
gcode:
  {% set cfg = printer['gcode_macro _NEXUS_CFG'] %}
  {% set tv = printer['gcode_macro _NEXUS_T' ~ params.TOOL] %}
  {% set axis = cfg.dock_direction[0] %}
  {% set sign = 1 if cfg.dock_direction[1] == '-' else -1 %}
  {% set dock_a = tv.dock_x if axis == 'X' else tv.dock_y %}
  {% for m in cfg[params.LIST] %}
    G1 {axis}{dock_a + sign * m.d}{(' E%.3f' % m.e) if m.e is defined else ''} F{m.f}
  {% endfor %}

[gcode_macro _NEXUS_DOCK]
gcode:
  {% set t = params.TOOL|int %}
  {% set ext = 'extruder' ~ (t if t > 0 else '') %}
  {% if printer.toolhead.extruder != ext %}
    ACTIVATE_EXTRUDER EXTRUDER={ext}
  {% endif %}
  SYNC_EXTRUDER_MOTION EXTRUDER=nexus_extruder MOTION_QUEUE={ext}
  _NEXUS_GOTO_DOCK TOOL={t}
  _NEXUS_RUN_MOVES TOOL={t} LIST=dock_moves
  SYNC_EXTRUDER_MOTION EXTRUDER=nexus_extruder MOTION_QUEUE=

[gcode_macro _NEXUS_PICKUP]
gcode:
  {% set cfg = printer['gcode_macro _NEXUS_CFG'] %}
  {% set t = params.TOOL|int %}
  {% set ext = 'extruder' ~ (t if t > 0 else '') %}
  {% set min_temp = printer.configfile.settings[ext].min_extrude_temp %}
  {% if printer.toolhead.extruder != ext %}
    ACTIVATE_EXTRUDER EXTRUDER={ext}
  {% endif %}
  SYNC_EXTRUDER_MOTION EXTRUDER=nexus_extruder MOTION_QUEUE={ext}
  _NEXUS_GOTO_DOCK TOOL={t}
  TEMPERATURE_WAIT SENSOR={ext} MINIMUM={min_temp}
  _NEXUS_RUN_MOVES TOOL={t} LIST=pickup_moves
  {% if cfg.wait_after_pickup %}
    _NEXUS_WAIT_TARGET TOOL={t}
  {% endif %}

# Separate macro so the target is read after the pickup, not before.
[gcode_macro _NEXUS_WAIT_TARGET]
gcode:
  {% set cfg = printer['gcode_macro _NEXUS_CFG'] %}
  {% set t = params.TOOL|int %}
  {% set ext = 'extruder' ~ (t if t > 0 else '') %}
  {% set target = printer[ext].target %}
  {% if target > 0 %}
    TEMPERATURE_WAIT SENSOR={ext} MINIMUM={target - cfg.temp_tolerance}
  {% endif %}

# Slicers send SET_PRESSURE_ADVANCE without EXTRUDER, or with the tool's
# extruder. The tool extruders have no stepper, so route it to the drive.
[gcode_macro SET_PRESSURE_ADVANCE]
rename_existing: _NEXUS_SET_PRESSURE_ADVANCE_BASE
description: Set pressure advance on the Nexus extruder drive
gcode:
  {% set ns = namespace(args='') %}
  {% for k, v in params.items() %}
    {% if k != 'EXTRUDER' %}
      {% set ns.args = ns.args ~ ' ' ~ k ~ '=' ~ v %}
    {% endif %}
  {% endfor %}
  _NEXUS_SET_PRESSURE_ADVANCE_BASE EXTRUDER=nexus_extruder{ns.args}
