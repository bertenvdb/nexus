# SPDX-License-Identifier: GPL-3.0-or-later
#####################################################################
# Nexus toolchanger for YUDX: user configuration
#
# This is the ONLY file you edit. Everything under nexus/ is code and
# board pinout. In printer.cfg:   [include nexus.cfg]
# Documentation: klipper/README.md in the Nexus repository.
#
# After every change: FIRMWARE_RESTART and check the console for
# "Nexus: config check OK".
#####################################################################

[include nexus/*.cfg]

#--------------------------------------------------------------------
# Boards
#   CAN:  ~/klippy-env/bin/python ~/klipper/scripts/canbus_query.py can0
#   USB:  ls /dev/serial/by-id/
# Use canbus_uuid OR serial per board.
#--------------------------------------------------------------------
[mcu nexus_tools]
canbus_uuid: 000000000000
#serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_XXXXXXXX-if00

[mcu nexus_docks]
canbus_uuid: 000000000001
#serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_YYYYYYYY-if00

# Stores the mounted tool across restarts. If printer.cfg already has a
# [save_variables] section, delete these two lines.
[save_variables]
filename: ~/printer_data/config/nexus_variables.cfg

#--------------------------------------------------------------------
# Extruder drive on the YUDX toolhead (pins on YOUR main/toolhead board)
# All tools share this stepper. Remove the old [extruder] section with
# step_pin etc. from printer.cfg: [extruder] is now hotend T0.
# Keep the name "nexus_extruder".
#--------------------------------------------------------------------
[extruder_stepper nexus_extruder]
extruder: extruder
step_pin: PE2
dir_pin: !PE3
enable_pin: !PD4
microsteps: 32
rotation_distance: 10.0
gear_ratio: 46:10, 21:24
pressure_advance: 0.04

# TMC driver of the drive, if any (example):
#[tmc2209 extruder_stepper nexus_extruder]
#uart_pin: PE1
#run_current: 0.6

# Hotend fan on the toolhead: must cool whichever tool is mounted, so list
# every configured extruder (placeholders included). Move your existing
# hotend fan here or change its heater: line.
#[heater_fan toolhead_hotend_fan]
#pin: PA8
#heater: extruder, extruder1, extruder2, extruder3, extruder4, extruder5, extruder6, extruder7
#heater_temp: 50.0

#--------------------------------------------------------------------
# General settings
#--------------------------------------------------------------------
[gcode_macro _NEXUS_CFG]
description: Nexus settings (edit in nexus.cfg)

# --- Tool change -----------------------------------------------------
# Safety latch: tool changes are refused until you have checked every
# dock coordinate (move there by hand first, at low speed). Then: True.
variable_docks_verified: False
# Direction the toolhead moves to ENTER a dock: 'X+', 'X-', 'Y+' or 'Y-'.
# YUDX default: docks at the front, entering towards -Y.
variable_dock_direction: 'Y-'
# Distance (mm) from the engaged dock position to the travel lane, where
# the toolhead moves sideways between docks.
variable_travel_lane: 43.0
# mm/s for moves to/from the docks and back to the print.
variable_travel_speed: 300
variable_z_speed: 15
# Lift Z by this much (mm) before going to the docks. 0 = no lift.
variable_z_hop: 0.0
# Absolute Z for docking, if the docks are not fixed to the gantry. -1 = no Z move.
variable_dock_z: -1
# Move back to where the change started (True), or stay at the dock (False).
# After NEXUS_PARK_TOOL the toolhead always stays in the travel lane.
variable_restore_position: True
# After a pickup, wait until the new tool is within temp_tolerance of its target.
variable_wait_after_pickup: True
# G-code to run before/after every change, e.g. 'M400' or your own macro.
variable_cmd_before_change: ''
variable_cmd_after_change: ''

# Dock and pickup sequences. Each move: d = distance (mm) from the engaged
# dock position along the dock axis (0 = fully in, positive = out),
# e = extruder move (mm, relative, optional; opens/closes the YUDX latch),
# f = feed rate (mm/min, as in G-code). Before each sequence the toolhead
# goes to the travel lane in front of the dock.
# Defaults = the YUDX author's RRF tfree0.g / tpost0.g (dock at Y-13, lane Y30).
variable_dock_moves: [
    {'d': 33, 'f': 18000},
    {'d': 4, 'e': -4, 'f': 12000},
    {'d': 0, 'e': -3, 'f': 5000},
    {'d': 43, 'f': 18000}]
variable_pickup_moves: [
    {'d': 13, 'e': 8, 'f': 18000},
    {'d': 2, 'e': -8, 'f': 10000},
    {'d': 0, 'f': 3000},
    {'d': 33, 'e': 7, 'f': 10000}]

# --- Temperatures and status LEDs ------------------------------------
# Targets at or below standby_temp show yellow, above it red.
variable_standby_temp: 150
# Below this a tool without target is "cold" (green).
variable_cool_temp: 50
# At target = within this many degrees.
variable_temp_tolerance: 3
variable_led_brightness: 0.5
# [red, green, blue], 0..1
variable_led_colors: {
    'cold': [0.0, 1.0, 0.0],
    'heating': [1.0, 0.35, 0.0],
    'standby': [1.0, 0.8, 0.0],
    'active': [1.0, 0.0, 0.0],
    'cooling': [0.0, 0.0, 1.0]}
# Tool shown by LED 1, 2, ... of each chain. -1 = LED off.
# Example for a chain wired T7 first: [7, 6, 5, 4, 3, 2, 1, 0]
variable_led_order_tools: [0, 1, 2, 3, 4, 5, 6, 7]
variable_led_order_docks: [0, 1, 2, 3, 4, 5, 6, 7]

# --- Staggered heat-up (PSU limit) -----------------------------------
# At most this many hotends heat from cold at the same time. 8 = no limit.
variable_max_cold_heaters: 3
# A hotend counts as cold below min(cold_threshold, target - cold_margin).
variable_cold_threshold: 150
variable_cold_margin: 10

# --- Fans ------------------------------------------------------------
# Supply fan (dock board fan 8): on while any tool has a target or is
# above this temperature. The dock fans are [heater_fan]s per tool.
variable_supply_fan_temp: 50
variable_supply_fan_speed: 1.0

# --- Filament sensors ------------------------------------------------
# Runout on a PARKED tool:
#   'defer' = mark the tool empty, pause after its next pickup
#   'pause' = pause immediately
# Runout on the mounted tool always pauses immediately.
variable_runout_parked: 'defer'

# --- Heater rail self-test (runs at every Klipper start) -------------
variable_rail_settle_ms: 1500
variable_rail_off_max: 2.0
variable_rail_on_min: 20.0
variable_rail_on_max: 28.0
# Shut Klipper down when the self-test fails (recommended). False only
# for bench tests without 24 V: heaters then stay disabled.
variable_selftest_fail_shutdown: True

# --- Commissioning test (NEXUS_COMMISSION) ---------------------------
variable_commission_time: 20
variable_commission_delta: 40
variable_commission_rise: 5.0
variable_commission_cross_max: 2.0
variable_commission_max_start: 60
gcode:

#####################################################################
# Tools
#
# One block per tool. Disable a tool:
#   - last tool(s): comment out the whole block.
#   - a tool in the middle (Klipper needs extruder numbers without gaps):
#     comment out the whole block EXCEPT replace the first include by
#     [include nexus/tools/tN_disabled.cfg]
# Then FIRMWARE_RESTART.
#
# Per tool:
#   dock_x, dock_y   toolhead position when fully engaged in the dock.
#                    The values below are EXAMPLES (T0 at X40 as in the
#                    YUDX RRF files, 40 mm pitch). Measure your own.
#   offset_x/y/z     nozzle offset relative to T0 (T0: 0, 0, 0), same sign
#                    as SET_GCODE_OFFSET: +1.0 in X = the toolhead moves
#                    1 mm further in +X to put this nozzle where T0's is.
#   [extruderN]      thermistor and heater settings. PID: run
#                    PID_CALIBRATE HEATER=extruderN TARGET=240 and copy
#                    the values here (do NOT use SAVE_CONFIG for these:
#                    Klipper refuses to save over values from an include).
#   filament         include runout (D2F/switch, connector pin 1) and/or
#                    motion (clog sensor, pin 4); comment out what you do
#                    not have. Options can be overridden below the include,
#                    e.g. [filament_motion_sensor nexus_t0_motion]
#                         detection_length: 15
#####################################################################

#--- T0 -------------------------------------------------------------
[include nexus/tools/t0.cfg]
[gcode_macro _NEXUS_T0]
variable_dock_x: 40.0
variable_dock_y: -13.0
variable_offset_x: 0.0
variable_offset_y: 0.0
variable_offset_z: 0.0
gcode:
[extruder]
# Thermistor: Generic 3950 (NTC 100K) or PT1000 (close the board jumper,
# pullup_resistor: 2195)
sensor_type: Generic 3950
pullup_resistor: 4700
max_temp: 300
min_extrude_temp: 170
nozzle_diameter: 0.400
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114.0
[include nexus/filament/t0_runout.cfg]
#[include nexus/filament/t0_motion.cfg]

