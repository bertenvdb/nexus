# Test printer for Klipper batch mode (see run_tests.sh). Not a real printer.
[mcu]
serial: /dev/null

[printer]
kinematics: corexy
max_velocity: 500
max_accel: 5000
max_z_velocity: 20
max_z_accel: 300

[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
microsteps: 16
rotation_distance: 40
endstop_pin: PG6
position_endstop: 350
position_min: 0
position_max: 350
homing_speed: 50

[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
microsteps: 16
rotation_distance: 40
endstop_pin: PG9
position_endstop: 350
position_min: -20
position_max: 350
homing_speed: 50

[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
microsteps: 16
rotation_distance: 8
endstop_pin: PG10
position_endstop: 0
position_max: 300

[pause_resume]
[virtual_sdcard]
path: /tmp/nexus_test_sd

[include nexus.cfg]

# Test overrides: batch mode reads every temperature as 0 C.
[gcode_macro _NEXUS_CFG]
variable_docks_verified: True

[extruder]
min_extrude_temp: 0

[extruder1]
min_extrude_temp: 0

[extruder2]
min_extrude_temp: 0

[extruder3]
min_extrude_temp: 0

[extruder4]
min_extrude_temp: 0

[extruder5]
min_extrude_temp: 0

[extruder6]
min_extrude_temp: 0

[extruder7]
min_extrude_temp: 0

[save_variables]
filename: /tmp/nexus_test_sd/variables.cfg

# Test only: echo every G1 so the dock sequences show up in the output.
[gcode_macro G1]
rename_existing: G1.9
gcode:
  RESPOND MSG="MOVE G1 {rawparams}"
  G1.9 {rawparams}

# Test only: batch mode drops RESPOND output; log it instead.
[gcode_macro RESPOND]
rename_existing: _TEST_RESPOND_BASE
gcode:
  {action_respond_info("RESPOND " ~ rawparams)}

